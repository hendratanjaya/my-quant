[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "openai-agents[any-llm,sqlalchemy]>=0.18.2",
    "pydantic-settings>=2.14.2",
    "scalar-fastapi>=1.8.2",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.51.0",
    "yfinance>=1.5.1",
    "chromadb>=0.5.20",
    "celery>=5.4.0",
    "redis>=5.2.1",
    "openai>=2.45.0",
    "ddgs>=9.14.4",
    "matplotlib>=3.11.1",
    "uvicorn-worker>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "M", "I"]
ignore = ["E501"]
